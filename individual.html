<!doctype html>
<html lang="en" data-rs-gate><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CMSP &amp; AMSP</title>
<!--
  CMSP & AMSP (resources.mismo.org/cms/individual.html), shown inside the CMS as a view of its own.

  MISMO's individual certifications, moved off the CMSP Master and AMSP Master Smartsheets on
  27 Oct 2026, following Perry Williams's build guides. Staff verify applications and renewals,
  record payments and record CMSP exam passes here. Everything that follows - the Certification
  Date, the certificate, every email, the renewal reminders, lapsing, the public lists - is done
  by the Individual certifications job in cms-data (.github/scripts/individual.js), which runs on
  each save.

  This file is page code only, in a public repository, so it holds no records. Everything is read
  after sign-in through MISMO's relay (project key cms) from the private cms-data:
    data/ind-config.json         program rules, Champion allotments and email wording (read)
    data/ind-members.json        member companies and levels, for Champion comps (read)
    data/db-ind-people.json      one record per person (read and written)
    data/db-ind-cycles.json      one record per application or renewal (read and written)
    data/db-ind-templates.json   email wording approved or edited here (read and written)
    data/db-ind-log.json         emails sent and form submissions taken in (read)
  Making changes needs Edit access to the CMS in People & Access. With View access the page is read only.
-->
<script src="/assets/session.js"></script>
<script src="embed.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --navy:#0f314c; --navy-deep:#06202f; --navy-mid:#14486e;
  --sky:#50a4db; --sky-wash:#dcedf8;
  --ground:#f1f6fa; --surface:#ffffff; --surface-2:#f6fafd; --surface-3:#e9f1f8;
  --border:#d5e2ed; --border-strong:#adc4d6; --rule:#e5eef5;
  --ink:#0f314c; --ink-2:#456179; --ink-3:#546f88;
  --good:#0f7b5c; --bad:#b3372c; --warn:#a2701a;
  --good-soft:#e1f2ec; --bad-soft:#fbe9e7; --warn-soft:#f7efe0;
  --accent:#14486e; --accent-soft:#dcedf8; --chip:#eef4f9;
  --display:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; /* no monospace anywhere (Jonna): figures use tabular-nums */
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#061722; --surface:#0d2837; --surface-2:#123143; --surface-3:#173c52;
    --border:#1f4a63; --border-strong:#2f6688; --rule:#173547;
    --ink:#e9f4fb; --ink-2:#a6c5d9; --ink-3:#7a9db4;
    --good:#4fc79b; --bad:#f08579; --warn:#e0a83c;
    --good-soft:#0c3128; --bad-soft:#3a1c19; --warn-soft:#3a2e13;
    --accent:#50a4db; --accent-soft:#123143; --chip:#173c52; --navy-mid:#7fc0ea;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#061722; --surface:#0d2837; --surface-2:#123143; --surface-3:#173c52;
  --border:#1f4a63; --border-strong:#2f6688; --rule:#173547;
  --ink:#e9f4fb; --ink-2:#a6c5d9; --ink-3:#7a9db4;
  --good:#4fc79b; --bad:#f08579; --warn:#e0a83c;
  --good-soft:#0c3128; --bad-soft:#3a1c19; --warn-soft:#3a2e13;
  --accent:#50a4db; --accent-soft:#123143; --chip:#173c52; --navy-mid:#7fc0ea;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font:14px/1.5 var(--display);-webkit-font-smoothing:antialiased}
.top{position:sticky;top:0;z-index:20;height:64px;background:var(--navy);color:#fff;display:flex;align-items:center;padding:0 22px;box-shadow:0 1px 0 rgba(80,164,219,.28)}
.logoplate{background:#fff;border-radius:7px;padding:8px 14px;display:flex;align-items:center;line-height:0;flex:0 0 auto}
.logoplate svg{height:24px;width:auto;display:block}
.mastrule{display:block;width:2px;height:34px;flex:0 0 auto;margin-inline:20px;border-radius:1px;background:var(--sky)}
.name{font-size:15.5px;font-weight:700;color:var(--sky);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-r{margin-left:auto;display:flex;align-items:center;gap:13px}
.eyebrow{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:rgba(255,255,255,.62);font-weight:600;white-space:nowrap}
#rs-account{flex:0 0 auto;display:inline-flex;align-items:center}
#rs-account .rs-who,#rs-account .rs-signin{border-radius:4px}
.theme{white-space:nowrap;background:none;border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:4px;padding:5px 9px;font:500 12px var(--display);cursor:pointer}
.theme:hover{border-color:var(--sky)}
@media(max-width:700px){.eyebrow{display:none}.mastrule{margin-inline:12px}.top{padding:0 14px}.logoplate{padding:6px 9px}.logoplate svg{height:17px}}
main{max-width:980px;margin:0 auto;padding:26px 16px 60px}
.vhead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;margin-bottom:18px}
h1{font-size:24px;line-height:1.2;margin:0;font-weight:700;letter-spacing:-.01em}
.vsub{color:var(--ink-2);margin-top:4px}
.back{margin-left:auto;color:var(--navy-mid);font-weight:600;font-size:13px;text-decoration:none;white-space:nowrap}
.back:hover{text-decoration:underline}
.banner{border:1px solid var(--border);border-left:3px solid var(--sky);background:var(--surface);border-radius:7px;padding:11px 14px;margin:0 0 18px;font-size:13px;color:var(--ink-2)}
.banner.bad{border-left-color:var(--bad)}
.banner b{color:var(--ink)}
.group{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:26px 0 8px}
details.sect{background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:10px}
details.sect > summary{list-style:none;cursor:pointer;padding:13px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-weight:600}
details.sect > summary::-webkit-details-marker{display:none}
details.sect > summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(-45deg);margin-right:4px;transition:transform .15s;flex:0 0 auto}
details.sect[open] > summary::before{transform:rotate(45deg)}
details.sect > summary:focus-visible{outline:2px solid var(--sky);outline-offset:2px;border-radius:8px}
.cnt{margin-left:auto;font-weight:500;font-size:12.5px;color:var(--ink-3)}
.chip{display:inline-flex;align-items:center;border-radius:4px;padding:1px 7px;font-size:11px;font-weight:600;background:var(--chip);color:var(--ink-2)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.off{background:var(--surface-3);color:var(--ink-3)}
.chip.edit{background:var(--accent-soft);color:var(--accent)}
.sbody{padding:2px 16px 16px;border-top:1px solid var(--rule)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 18px;margin:14px 0 16px}
.fact label{display:block;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:2px}
.fact div{font-size:13px;color:var(--ink)}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:4px}
.fld input,.fld textarea{width:100%;font:13.5px/1.5 var(--display);color:var(--ink);background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:8px 10px}
.fld textarea{min-height:220px;resize:vertical;font-size:13px}
.fld input:focus,.fld textarea:focus{outline:2px solid var(--sky);outline-offset:0;border-color:transparent}
.fld input:disabled,.fld textarea:disabled{opacity:.75;cursor:not-allowed}
.hint{font-size:12px;color:var(--ink-3);line-height:1.5}
.hint code,.fields code{font-family:var(--mono);font-size:11.5px;background:var(--chip);border-radius:3px;padding:0 4px;color:var(--ink-2)}
.btnrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
.btn{font:600 13px var(--display);border-radius:6px;padding:8px 14px;cursor:pointer;white-space:nowrap;min-width:max-content;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--navy-mid);background:var(--navy-mid);color:#fff}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--navy-mid)}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
.who{font-size:12px;color:var(--ink-3)}
.status{font-size:12px;font-weight:600}
.status.good{color:var(--good)} .status.bad{color:var(--bad)} .status.wait{color:var(--warn)}
.rules{display:grid;gap:10px;margin-top:12px}
.rule{display:grid;grid-template-columns:110px 1fr;gap:12px;font-size:13px}
.rule .d{font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.rule b{display:block;color:var(--ink)}
.rule span{color:var(--ink-2)}
@media(max-width:560px){.rule{grid-template-columns:1fr;gap:2px}}
.prose p{font-size:13px;margin:0 0 10px;color:var(--ink)}
.prose table{width:100%;border-collapse:collapse;font-size:13px;margin:4px 0 10px}
.prose th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600;padding:6px 12px 6px 0;border-bottom:1px solid var(--border)}
.prose td{padding:7px 12px 7px 0;border-bottom:1px solid var(--border);vertical-align:top}
.prose td:first-child{font-family:var(--mono);font-size:12px;white-space:nowrap}
.toast{position:fixed;bottom:18px;left:50%;z-index:50;width:min(460px,calc(100vw - 32px));background:var(--surface);color:var(--ink);border:1px solid var(--border);border-left:3px solid var(--good);border-radius:7px;padding:11px 14px;font-size:13px;box-shadow:0 10px 28px rgba(6,32,47,.22);opacity:0;transform:translate(-50%,8px);transition:opacity .16s,transform .16s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.bad{border-left-color:var(--bad)}
.loading{padding:40px 0;text-align:center;color:var(--ink-3)}
.foot{font-size:11.5px;color:var(--ink-3);margin-top:30px;line-height:1.55}
.item{background:var(--surface);border:1px solid var(--border);border-radius:9px;margin-bottom:14px;overflow:hidden}
.item.done{border-color:var(--good)}
.ihead{display:flex;flex-wrap:wrap;align-items:flex-start;gap:6px 14px;padding:14px 16px 10px}
.ihead h2{font-size:17px;margin:0;font-weight:700;line-height:1.3}
.ihead .what{font-size:13px;color:var(--ink-2);margin-top:2px}
.ihead .right{margin-left:auto;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ibody{padding:0 16px 14px}
.facts{margin:4px 0 12px}
.box{border:1px solid var(--border);border-left:3px solid var(--sky);background:var(--surface-2);border-radius:6px;padding:10px 12px;margin:0 0 12px;font-size:13.5px;white-space:pre-wrap}
.box.find{border-left-color:var(--warn)}
.box.clean{border-left-color:var(--good)}
.qnote{margin:2px 0 10px}
.qnote textarea{min-height:58px}
.box h3{margin:0 0 4px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;white-space:normal}
.flist{margin:0;padding-left:18px}
.flist li{margin:0 0 6px}
.flist .meta{display:block;font-size:11.5px;color:var(--ink-3)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.btn.good{background:var(--good);border-color:var(--good)}
.btn.bad{background:transparent;color:var(--bad);border-color:var(--bad)}
.decide{display:none;margin-top:12px;border-top:1px solid var(--rule);padding-top:12px}
.decide.on{display:block}
.decide textarea{min-height:110px}
.decide .warnline{font-size:12.5px;color:var(--warn);font-weight:600;margin:0 0 8px}
.decide input[type=date]{max-width:220px}
.outcome{padding:12px 16px;border-top:1px solid var(--rule);background:var(--good-soft);color:var(--ink);font-size:13.5px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.outcome b{color:var(--good)}
.empty{background:var(--surface);border:1px dashed var(--border-strong);border-radius:9px;padding:28px 18px;text-align:center;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.count{font-size:13px;color:var(--ink-3);font-weight:500;margin-left:8px}
@media(max-width:560px){.ihead .right{margin-left:0}.btn{flex:1 1 auto}}
html.embed .top{display:none}
html.embed main{padding-top:6px;max-width:none}
html.embed .back{display:none}
html.embed body{background:transparent}
/* ---- CMSP & AMSP (individual.html) ---- */
main{max-width:1100px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 18px;padding:4px;background:var(--surface);border:1px solid var(--border);border-radius:8px}
.tab{font:600 13px var(--display);background:none;border:0;border-radius:6px;color:var(--ink-2);padding:8px 14px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;transition:background .14s,color .14s}
.tab:hover{color:var(--ink);background:var(--surface-2)}
.tab.on{color:#fff;background:var(--navy)}
:root[data-theme="dark"] .tab.on{background:#74bfeb;color:#06202f}
.tab .n{display:inline-block;min-width:20px;margin-left:7px;padding:0 6px;border-radius:4px;background:var(--accent-soft);color:var(--accent);font-size:11px;line-height:18px;text-align:center}
.tab .n.warn{background:var(--warn-soft);color:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 18px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.stat b{display:block;font-size:22px;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--ink-3)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:9px;margin-bottom:12px}
.card.flagged{border-left:3px solid var(--warn)}
.chead{display:flex;flex-wrap:wrap;align-items:flex-start;gap:6px 12px;padding:13px 16px 9px}
.chead h3{font-size:16px;margin:0;line-height:1.3}
.chead .what{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.chead .right{margin-left:auto;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.cbody{padding:0 16px 14px}
.flags{margin:6px 0 10px;padding:0;list-style:none}
.flags li{font-size:12.5px;color:var(--warn);padding:3px 0 3px 18px;position:relative}
.flags li::before{content:"!";position:absolute;left:3px;top:3px;font-weight:700}
table.pts{width:100%;border-collapse:collapse;font-size:12.5px;margin:6px 0 4px}
table.pts th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;padding:5px 8px 5px 0;border-bottom:1px solid var(--border)}
table.pts td{padding:5px 8px 5px 0;border-bottom:1px solid var(--rule);vertical-align:top}
table.pts td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.pts tr.out td{color:var(--ink-3);text-decoration:line-through}
table.pts tr.out td.keep{text-decoration:none}
table.pts input[type=number]{width:62px;font:12.5px var(--display);padding:3px 5px;border:1px solid var(--border);border-radius:4px;background:var(--surface-2);color:var(--ink)}
.tally{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;margin:6px 0 2px;color:var(--ink-2)}
.tally b{color:var(--ink)}
.ok{color:var(--good);font-weight:600}.short{color:var(--warn);font-weight:600}
.fees{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px;margin:8px 0}
.fee{border:1px solid var(--border);border-radius:7px;padding:8px 10px;background:var(--surface-2)}
.fee .t{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.fee .v{font-size:13px;margin:2px 0 6px}
.mini{font:600 12px var(--display);border-radius:5px;padding:4px 9px;cursor:pointer;white-space:nowrap;min-width:max-content;border:1px solid var(--navy-mid);background:transparent;color:var(--navy-mid)}
.mini:hover{background:var(--accent-soft)}
.mini:disabled{opacity:.5;cursor:not-allowed}
.btn.good{background:var(--good);border-color:var(--good)}
.btn.bad{background:transparent;color:var(--bad);border-color:var(--bad)}
.ask{border:1px solid var(--border);border-radius:8px;background:var(--surface-2);padding:12px;margin-top:10px}
.ask .fld textarea{min-height:70px}
.ask .row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.ask select,.ask input[type=date],.ask input[type=text],.ask input[type=email]{width:100%;font:13px var(--display);padding:7px 9px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--ink)}
.search{width:100%;max-width:420px;font:14px var(--display);padding:8px 11px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--ink);margin-bottom:12px}
table.list{width:100%;border-collapse:collapse;font-size:13px;background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden}
table.list th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--border);background:var(--surface-2)}
table.list td{padding:8px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
table.list tr.click{cursor:pointer}
table.list tr.click:hover td{background:var(--surface-2)}
.panel{position:fixed;inset:0 0 0 auto;width:min(720px,100vw);background:var(--ground);border-left:1px solid var(--border);box-shadow:-12px 0 30px rgba(6,32,47,.18);z-index:40;overflow:auto;padding:18px 18px 60px;transform:translateX(100%);transition:transform .18s}
.panel.on{transform:none}
.panel .x{float:right;font:600 13px var(--display);background:none;border:1px solid var(--border);border-radius:6px;padding:5px 10px;cursor:pointer;color:var(--ink-2)}
.hist{font-size:12px;color:var(--ink-2);margin:6px 0 0;padding-left:16px}
.hist li{margin:2px 0}
.small{font-size:12px;color:var(--ink-3)}
.empty{background:var(--surface);border:1px dashed var(--border-strong);border-radius:8px;padding:16px;color:var(--ink-2);font-size:13px}
.empty b{display:block;color:var(--ink);margin-bottom:2px}
.preview{border:1px solid var(--border);border-radius:7px;background:var(--surface);padding:12px 14px;font-size:13px;white-space:pre-wrap;margin:8px 0}
.pill{display:inline-block;border-radius:4px;white-space:nowrap;padding:0 7px;font-size:11px;font-weight:600;background:var(--chip);color:var(--ink-2);margin-right:4px}
.pill.Active{background:var(--good-soft);color:var(--good)}
.pill.Lapsed,.pill.Expired{background:var(--warn-soft);color:var(--warn)}
.pill.InReview,.pill.Verified{background:var(--accent-soft);color:var(--accent)}
@media(max-width:640px){.chead .right{margin-left:0}table.list .hide-s{display:none}}
/* inside the CMS the page is as tall as its content, so the person opens in place of the list */
html.embed .panel{position:static;transform:none;width:auto;box-shadow:none;border:0;padding:0 0 30px;display:none;background:transparent}
html.embed .panel.on{display:block}
html.embed body.person-open main{display:none}
  [style*="var(--mono)"], .num{font-variant-numeric:tabular-nums;}

/* ══ Page Kit (1 Nov 2026, Jonna: "go through all pages and make user friendly, easy to understand,
   not repetitive, 10x plus them all up"): the CMS hero, figure boxes of this page's own figures,
   people as cards with monograms, filter buttons instead of long stacks, nothing folded. ══ */
:root{--brand-sky:#74bfeb;--track:#e9f1f8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--track:#173c52}:root:not([data-theme="light"]) .tab.on{background:#74bfeb;color:#06202f}}
:root[data-theme="dark"]{--track:#173c52}
.tqh{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:18px;color:#fff;border-radius:12px;padding:24px 26px;margin-bottom:16px;position:relative;overflow:hidden;
  background:radial-gradient(900px 260px at 100% -30%,rgba(116,191,235,.30),transparent 60%),linear-gradient(135deg,#06202f 0%,#0d314c 58%,#14486e 100%);box-shadow:0 10px 30px rgba(6,32,47,.25)}
.tqh:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.06;background-image:linear-gradient(rgba(255,255,255,.9) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.9) 1px,transparent 1px);background-size:28px 28px}
.tqh-hi{position:relative;z-index:1;min-width:0}
.tqh-eb{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--brand-sky)}

.hbtn{font:600 13px var(--display);white-space:nowrap;min-width:max-content;border-radius:6px;padding:8px 14px;cursor:pointer;text-decoration:none;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.28);transition:background .14s}

.hbtn.solid{background:#74bfeb;color:#06202f;border-color:#74bfeb}
.hbtn.solid:hover{background:#94c8e9}
html.embed .hbtn.cms{display:none}
.tqh-needs{background:rgba(255,255,255,.07);border:1px solid rgba(116,191,235,.25);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px;position:relative;z-index:1;min-width:0}
.tqh-nh{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:rgba(255,255,255,.7);display:flex;gap:8px;align-items:baseline}
.tqh-nh span{letter-spacing:0;text-transform:none;font-weight:500;color:rgba(255,255,255,.5)}
.tqh-need{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;align-items:baseline;text-align:left;background:rgba(255,255,255,.06);border:0;border-left:3px solid var(--k,#74bfeb);border-radius:5px;padding:7px 10px;color:#fff;font:inherit;cursor:pointer;transition:background .15s,transform .15s}
.tqh-need:hover{background:rgba(255,255,255,.13);transform:translateX(2px)}
.tqh-need span{font-size:11.5px;color:rgba(255,255,255,.65);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tqh-need b{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tqh-nempty{font-size:13px;color:rgba(255,255,255,.7);padding:6px 2px}
.tqh-all{align-self:flex-start;margin-top:4px;border:0;background:none;padding:2px 0;color:#74bfeb;font:inherit;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.tqh-all:hover{text-decoration:underline}
.tqb{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:22px}
.tqt{position:relative;display:flex;flex-direction:column;gap:10px;min-width:0;padding:16px 18px;border:1px solid rgba(116,191,235,.18);border-radius:12px;color:#fff;cursor:pointer;text-align:left;font:inherit;
  background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--k,#74bfeb) 26%,transparent),transparent 60%),linear-gradient(160deg,#10324a,#0b2436);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 10px 24px -14px rgba(6,32,47,.6);transition:transform .18s,box-shadow .18s;overflow:hidden}
.tqt:hover{transform:translateY(-3px);box-shadow:0 0 0 1px color-mix(in srgb,var(--k,#74bfeb) 55%,transparent),0 18px 34px -16px rgba(6,32,47,.75)}
.tqt:focus-visible{outline:2px solid #74bfeb;outline-offset:2px}

.tqt.on:after{content:"";position:absolute;left:18px;right:18px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--k)}
.tqt-top{display:flex;align-items:center;gap:8px;min-width:0}
.tqt-lab{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:color-mix(in srgb,var(--k,#74bfeb) 70%,#fff);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tqt-pill{margin-left:auto;flex:0 0 auto;font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;background:rgba(255,255,255,.12);color:#fff;white-space:nowrap}
.tqt-pill.hot{background:#c94a3b;animation:tqPulse 2.2s ease-in-out infinite}

.tqt-sub{font-size:12.5px;line-height:1.45;color:rgba(255,255,255,.78)}
.tqt-meter{height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:auto}
.tqt-meter i{display:block;height:100%;background:var(--k);border-radius:3px;transition:width .9s ease}
.tqt-list{display:flex;flex-direction:column;gap:4px;margin-top:auto}
.tqt-row{display:flex;gap:8px;align-items:baseline;padding:5px 8px;border-radius:5px;background:rgba(255,255,255,.06);border-left:3px solid var(--k);font-size:12px;min-width:0}
.tqt-row b{flex:0 1 auto;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tqt-row i{flex:1 1 auto;font-style:normal;color:rgba(255,255,255,.65);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tqt-row em{flex:0 0 auto;font-style:normal;font-weight:700;color:var(--k)}
.tbar{display:flex;height:8px;border-radius:3px;overflow:hidden;background:rgba(255,255,255,.12);margin-top:auto}
.tbar i{display:block;height:100%}
.tleg{display:flex;gap:14px;font-size:11.5px;color:rgba(255,255,255,.7)}
.tleg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.pk-months{display:flex;gap:6px;align-items:flex-end;height:52px;margin-top:auto}
.pk-months > span{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;gap:3px;min-width:0}
.pk-months i{display:block;background:var(--k);border-radius:2px 2px 0 0;opacity:.5;min-height:2px}
.pk-months i.now{opacity:1}
.pk-months small{font-size:9.5px;text-align:center;color:rgba(255,255,255,.6);letter-spacing:.04em;text-transform:uppercase}

.fb{font:600 12.5px var(--display);display:inline-flex;align-items:center;gap:7px;white-space:nowrap;min-width:max-content;border:1px solid var(--border);background:var(--surface);color:var(--ink-2);border-radius:6px;padding:6px 11px;cursor:pointer;transition:border-color .14s,background .14s}

.tool{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 12px}
.tool .search{margin:0;flex:0 1 340px;min-width:0}
.tool .fbar{margin:0}
.tool .cntl{font-size:12.5px;color:var(--ink-3);margin-left:auto}
/* to-do cards */
.card{box-shadow:0 1px 2px rgba(6,32,47,.05);transition:box-shadow .15s,border-color .15s;scroll-margin-top:90px}
.card:hover{box-shadow:0 8px 22px rgba(6,32,47,.09)}

.card .dline{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--rule);border-radius:7px;background:var(--surface-2);margin:0 0 8px;font-size:12.5px;color:var(--ink-2)}
.card .dline b{color:var(--ink)}
.pk-flash{animation:pkFlash 1.4s ease}
@keyframes pkFlash{0%{box-shadow:0 0 0 0 rgba(116,191,235,0)}25%{box-shadow:0 0 0 4px rgba(116,191,235,.6)}100%{box-shadow:0 0 0 0 rgba(116,191,235,0)}}
#tabs{scroll-margin-top:90px}

.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.pcard{display:flex;gap:12px;align-items:flex-start;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:12px 14px;cursor:pointer;min-width:0;box-shadow:0 1px 2px rgba(6,32,47,.04);transition:transform .14s,box-shadow .14s,border-color .14s}
.pcard:hover{transform:translateY(-2px);border-color:var(--sky);box-shadow:0 10px 22px rgba(6,32,47,.1)}

.pcard .pb > small{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .pst{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:6px;align-items:center}
.pcard .pst .small{font-size:11.5px}

.rrow.late{box-shadow:inset 4px 0 0 var(--bad),0 1px 2px rgba(6,32,47,.04)}
.rrow.warm{box-shadow:inset 4px 0 0 var(--warn),0 1px 2px rgba(6,32,47,.04)}
.rrow .rco{display:flex;align-items:center;gap:12px;min-width:0}
.rrow .rco > span:last-child{min-width:0;display:flex;flex-direction:column}
.rrow .rco b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow small{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.rrow.comp{grid-template-columns:minmax(0,2fr) 100px minmax(0,1.2fr) minmax(0,2fr)}
.cmeter{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-variant-numeric:tabular-nums}
